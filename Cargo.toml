[workspace]
members = ["crates/danmu-ffi"]
default-members = ["."]
resolver = "3"

[package]
name = "shisui-danmu"
version = "0.5.1"
edition = "2024"
rust-version = "1.89"
description = "面向知识型主播的跨平台弹幕与直播监控 TUI 工作台"
license = "MPL-2.0"
repository = "https://github.com/rockythink/shisui-danmu"
authors = ["Elazer <apps@elazer.wang>"]
homepage = "https://github.com/rockythink/shisui-danmu"
readme = "README.md"
keywords = ["bilibili", "danmaku", "tui", "streaming", "obs"]
categories = ["command-line-utilities"]
default-run = "danmu"

[[bin]]
name = "danmu"
path = "src/main.rs"
required-features = ["tui"]

[features]
default = ["tui"]
tui = ["dep:clap", "dep:crossterm", "dep:ratatui", "dep:qrcode", "dep:rpassword", "dep:tui-input", "dep:unicode-width"]
test-support = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
brotli = "8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"], optional = true }
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
directories = "6"
flate2 = "1"
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
obws = { version = "0.15.0", features = ["events"] }
qrcode = { version = "0.14", default-features = false, optional = true }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "cookies", "gzip", "brotli"] }
rpassword = { version = "7", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "net", "process", "io-util", "io-std"] }
tokio-util = { version = "=0.7.19", features = ["codec"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
toml_edit = "0.23"
rusqlite = { version = "0.37", features = ["bundled"] }
tui-input = { version = "0.15.4", optional = true }
unicode-segmentation = "1"
unicode-width = { version = "0.2", optional = true }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Console", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
