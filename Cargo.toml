[package]
name = "shisui-danmu"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "面向知识型主播的跨平台弹幕与直播监控 TUI 工作台"
license = "MPL-2.0"
repository = "https://github.com/rockythink/shisui-danmu"
default-run = "danmu"

[[bin]]
name = "danmu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
brotli = "8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
flate2 = "1"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
obws = { version = "0.15.0", features = ["events"] }
qrcode = { version = "0.14", default-features = false }
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "gzip", "brotli"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
tui-input = "0.15.4"
unicode-segmentation = "1"
unicode-width = "0.2"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
