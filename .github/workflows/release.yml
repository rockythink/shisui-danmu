name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify public TUI
        run: ./script/verify.sh

      - name: Build Universal release archive
        run: ./script/package_release.sh "$GITHUB_REF_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/shisui-danmu-macos-universal.tar.gz \
            dist/shisui-danmu-macos-universal.tar.gz.sha256 \
            --verify-tag \
            --generate-notes \
            --title "拾穗弹幕台 TUI $GITHUB_REF_NAME"
