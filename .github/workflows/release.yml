name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

jobs:
  verify-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Match Git tag and Cargo package version
        run: |
          CARGO_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "v$CARGO_VERSION" = "$GITHUB_REF_NAME"

  build-unix:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: shisui-danmu-macos-aarch64.tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: shisui-danmu-macos-x86_64.tar.gz
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: shisui-danmu-linux-x86_64.tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: shisui-danmu-linux-aarch64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset }}" -C "target/${{ matrix.target }}/release" danmu
          if command -v shasum >/dev/null 2>&1; then
            (cd dist && shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          else
            (cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  build-windows:
    needs: verify-version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/danmu.exe -DestinationPath dist/shisui-danmu-windows-x86_64.zip
          $hash = (Get-FileHash dist/shisui-danmu-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  shisui-danmu-windows-x86_64.zip" | Set-Content -Encoding ascii dist/shisui-danmu-windows-x86_64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-pc-windows-msvc
          path: dist/*

  package-npm:
    needs: [build-unix, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Build npm and Bun package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node script/package_npm.mjs "$VERSION" dist dist/npm/danmu-tui
          mkdir -p dist/npm-tarball
          npm pack ./dist/npm/danmu-tui --pack-destination dist/npm-tarball
      - name: Smoke test npm launcher
        run: |
          mkdir -p /tmp/danmu-npm-smoke
          npm install --prefix /tmp/danmu-npm-smoke ./dist/npm-tarball/*.tgz
          /tmp/danmu-npm-smoke/node_modules/.bin/danmu --version
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/npm-tarball/*.tgz

  package-homebrew:
    needs: [build-unix, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate Homebrew Formula
        run: ./script/generate_homebrew_formula.sh "$GITHUB_REF_NAME" dist dist/homebrew/danmu.rb
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: dist/homebrew/danmu.rb

  publish-github:
    needs: [build-unix, build-windows, package-npm, package-homebrew]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "DANMU $GITHUB_REF_NAME"

  publish-crates:
    needs: publish-github
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates.io package
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked
      - name: Explain skipped crates.io publication
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "CARGO_REGISTRY_TOKEN 未配置；保留 GitHub Release，稍后可手动 cargo publish。"

  publish-npm:
    needs: [publish-github, package-npm]
    runs-on: ubuntu-24.04
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - name: Publish npm package
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish dist/*.tgz --access public --provenance
      - name: Explain skipped npm publication
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "NPM_TOKEN 未配置；npm/Bun 包仍附加在 GitHub Release，可稍后手动发布。"

  publish-homebrew:
    needs: [publish-github, package-homebrew]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-formula
          path: dist
      - name: Update rockythink/homebrew-tap
        if: env.GH_TOKEN != ''
        run: |
          CONTENT="$(base64 -w 0 dist/danmu.rb)"
          SHA="$(gh api repos/rockythink/homebrew-tap/contents/Formula/danmu.rb --jq .sha 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT repos/rockythink/homebrew-tap/contents/Formula/danmu.rb \
              -f message="danmu $GITHUB_REF_NAME" -f content="$CONTENT" -f sha="$SHA"
          else
            gh api --method PUT repos/rockythink/homebrew-tap/contents/Formula/danmu.rb \
              -f message="danmu $GITHUB_REF_NAME" -f content="$CONTENT"
          fi
      - name: Explain skipped Homebrew publication
        if: env.GH_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN 未配置；Formula 已附加在 GitHub Release，可稍后手动更新。"
