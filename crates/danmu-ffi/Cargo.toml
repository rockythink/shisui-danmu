[package]
name = "danmu-ffi"
version = "0.5.1"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
description = "Public asynchronous desktop bindings for the DANMU shared runtime"

[lib]
name = "danmu_ffi"
crate-type = ["staticlib", "cdylib"]

[features]
default = []
bindgen = ["uniffi/cli"]
test-support = ["shisui-danmu/test-support"]

[[bin]]
name = "danmu-bindgen"
path = "src/bin/danmu-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
shisui-danmu = { path = "../..", default-features = false }
uniffi = { version = "=0.32.2", default-features = false, features = ["tokio"] }
anyhow = "1"
chrono = "0.4"
thiserror = "2"
serde_json = "1"
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["sync"] }
url = "2"
uuid = "1"
